<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Usuário &bull; UserCore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen text-gray-200 flex flex-col selection:bg-cyan-500 selection:text-black">

  <!-- Top Navigation Bar -->
  <header class="border-b border-gray-800/80 bg-gray-950/60 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="./index.html" class="flex items-center space-x-3 group">
        <div class="w-9 h-9 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 group-hover:border-cyan-400 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span class="font-bold text-lg tracking-wider text-white">USER<span class="text-cyan-400">CORE</span></span>
      </a>

      <a href="./users-list.html" class="text-xs font-medium text-gray-400 hover:text-cyan-400 flex items-center space-x-1.5 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>Voltar à lista</span>
      </a>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-grow max-w-3xl w-full mx-auto px-6 py-10">

    <div class="card-tech rounded-2xl p-8 sm:p-10 relative">
      
      <!-- Linha neon superior -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent opacity-80"></div>

      <!-- Título da Seção -->
      <div class="mb-8">
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Cadastrar Novo Usuário</h1>
        <p class="text-xs text-gray-400 mt-1">Insira os dados do usuário para registro</p>
      </div>

      <!-- Feedback Banner -->
      <div id="feedback-banner" class="hidden mb-6 p-3.5 rounded-xl text-xs flex items-center space-x-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="feedback-text"></span>
      </div>

      <!-- Formulário Integrado à API -->
      <form id="create-user-form" class="space-y-6">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          
          <!-- Nome -->
          <div>
            <label for="name" class="block text-xs font-medium uppercase tracking-wider text-gray-300 mb-1.5">
              Nome Completo
            </label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              required 
              placeholder="Ex: Gabriel Izidoro" 
              class="input-tech w-full px-4 py-2.5 text-sm rounded-lg placeholder-gray-500"
            >
          </div>

          <!-- Telefone -->
          <div>
            <label for="phone" class="block text-xs font-medium uppercase tracking-wider text-gray-300 mb-1.5">
              Telefone
            </label>
            <input 
              type="tel" 
              id="phone" 
              name="phone" 
              required 
              placeholder="(11) 98765-4321" 
              class="input-tech w-full px-4 py-2.5 text-sm rounded-lg placeholder-gray-500"
            >
          </div>

          <!-- E-mail -->
          <div>
            <label for="mail" class="block text-xs font-medium uppercase tracking-wider text-gray-300 mb-1.5">
              E-mail
            </label>
            <input 
              type="email" 
              id="mail" 
              name="mail" 
              required 
              placeholder="usuario@dominio.com" 
              class="input-tech w-full px-4 py-2.5 text-sm rounded-lg placeholder-gray-500"
            >
          </div>

          <!-- Senha -->
          <div>
            <label for="password" class="block text-xs font-medium uppercase tracking-wider text-gray-300 mb-1.5">
              Senha de Acesso
            </label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              placeholder="••••••••••••" 
              class="input-tech w-full px-4 py-2.5 text-sm rounded-lg placeholder-gray-500"
            >
          </div>

        </div>

        <!-- Botões de Ação -->
        <div class="flex items-center justify-end space-x-4 pt-6 border-t border-gray-800">
          <a href="./users-list.html" class="px-5 py-2.5 text-xs font-semibold text-gray-400 hover:text-white transition">
            Cancelar
          </a>
          <button 
            type="submit" 
            id="btn-submit"
            class="neon-glow-btn px-6 py-2.5 text-xs rounded-lg cursor-pointer transition"
          >
            <span id="btn-submit-text">Cadastrar Registro</span>
          </button>
        </div>

      </form>

    </div>

  </main>

  <!-- Rodapé -->
  <footer class="border-t border-gray-900 py-4 text-center text-xs text-gray-500">
    UserCore &bull; Premium Tech Architecture
  </footer>

  <script src="./js/api.js"></script>
  <script src="./js/user-create.js"></script>
</body>
</html>
