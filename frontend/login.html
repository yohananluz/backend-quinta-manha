<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &bull; UserCore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

  <!-- Header Clean -->
  <header class="w-full border-b border-gray-800/80 bg-gray-950/60 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="./index.html" class="flex items-center space-x-3 group">
        <div class="w-9 h-9 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 group-hover:border-cyan-400 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span class="font-bold text-lg tracking-wider text-white">USER<span class="text-cyan-400">CORE</span></span>
      </a>
      <nav class="flex items-center space-x-6">
        <a href="./index.html" class="text-xs font-medium text-gray-400 hover:text-cyan-400 transition">Portal</a>
        <a href="./users-list.html" class="text-xs font-medium text-gray-400 hover:text-cyan-400 transition">Usuários</a>
      </nav>
    </div>
  </header>

  <!-- Login Card Centrado -->
  <main class="flex-grow flex items-center justify-center p-6">
    <div class="w-full max-w-sm">
      
      <div class="card-tech rounded-2xl p-8 sm:p-9 relative overflow-hidden">
        
        <!-- Efeito sutil de luz neon superior -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent opacity-80"></div>

        <!-- Cabeçalho -->
        <div class="text-center mb-8">
          <h1 class="text-2xl font-extrabold text-white tracking-tight">Acesso ao Sistema</h1>
          <p class="text-xs text-gray-400 mt-2">Autenticação segura de usuários</p>
        </div>

        <!-- Feedback Banner -->
        <div id="feedback-banner" class="hidden mb-5 p-3 rounded-xl text-xs flex items-center space-x-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span id="feedback-text"></span>
        </div>

        <!-- Formulário Conectado à API -->
        <form id="login-form" class="space-y-5">
          
          <!-- E-mail -->
          <div>
            <label for="email" class="block text-xs font-medium uppercase tracking-wider text-gray-300 mb-1.5">
              E-mail
            </label>
            <div class="relative">
              <input 
                type="email" 
                id="email" 
                name="email" 
                required 
                placeholder="seu.email@exemplo.com" 
                class="input-tech w-full px-4 py-2.5 text-sm rounded-lg placeholder-gray-500"
              >
            </div>
          </div>

          <!-- Senha -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="senha" class="block text-xs font-medium uppercase tracking-wider text-gray-300">
                Senha
              </label>
              <a href="#" class="text-xs text-cyan-400 hover:text-cyan-300 transition">Esqueceu?</a>
            </div>
            <div class="relative">
              <input 
                type="password" 
                id="senha" 
                name="senha" 
                required 
                placeholder="••••••••••••" 
                class="input-tech w-full px-4 py-2.5 text-sm rounded-lg placeholder-gray-500"
              >
            </div>
          </div>

          <!-- Lembrar -->
          <div class="flex items-center justify-between text-xs pt-1">
            <label class="flex items-center space-x-2 text-gray-400 cursor-pointer">
              <input type="checkbox" name="lembrar" class="rounded bg-gray-900 border-gray-700 text-cyan-500 focus:ring-cyan-500">
              <span>Lembrar credenciais</span>
            </label>
          </div>

          <!-- Botão Neon -->
          <div class="pt-2">
            <button 
              type="submit" 
              id="btn-submit"
              class="neon-glow-btn w-full py-2.5 px-4 rounded-lg text-sm flex items-center justify-center space-x-2 cursor-pointer transition"
            >
              <span id="btn-submit-text">Entrar</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </button>
          </div>

        </form>

        <!-- Rodapé do Card -->
        <div class="mt-6 pt-5 border-t border-gray-800 text-center">
          <p class="text-xs text-gray-400">
            Não possui conta?
            <a href="./user-create.html" class="text-cyan-400 hover:text-cyan-300 font-semibold ml-1">Criar acesso</a>
          </p>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer Minimalista -->
  <footer class="w-full border-t border-gray-900 py-4 text-center text-xs text-gray-500">
    UserCore &bull; Premium Tech Architecture
  </footer>

  <script src="./js/api.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
